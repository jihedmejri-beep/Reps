// Classes the Compose compiler should treat as stable.
//
// The domain models are immutable data classes, but several hold a List, and
// Compose infers kotlin.collections.List as unstable because the interface
// admits a mutable implementation. That marks the whole model unstable, and any
// composable taking one can never skip recomposition - so a list screen rebuilds
// every row whenever anything above it changes.
//
// Declaring them here rather than annotating them with @Immutable keeps the
// domain layer free of any Compose dependency, which is the point of having it
// separate from the UI.
com.reps.app.domain.model.*
